# Stress config for the HCI RX buffer-pressure test (backlog item 3).
# Shrink the discardable event pool to 1 so that, under an LE advertising-report
# flood (`bt scan on` in a dense RF area), bt_buf_get_evt(discardable, K_NO_WAIT)
# returns NULL almost continuously. The hardened RX path must DROP on that NULL
# instead of dereferencing it; with the old code this guaranteed a NULL-deref
# fault. Merge only for the stress build:
#   west build -b rpi_pico2/rp2350a/m33/w -d build_rxstress app \
#       -- -DEXTRA_CONF_FILE="<abs>/app/local.conf;<abs>/test/coex/rx_stress.conf"
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=1
