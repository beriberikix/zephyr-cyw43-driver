# WHD-port build fragment — drive WiFi via the upstream Infineon AIROC/WHD
# driver over the board's PIO-SPI, instead of this module's georgerobotics
# cyw43_ll stack. Layered after app/prj.conf via EXTRA_CONF_FILE.
#
#   west build -p always -b rpi_pico2/rp2350a/m33/w -d build_whd app \
#     -- -DEXTRA_CONF_FILE="$PWD/app/local.conf;$PWD/test/coex/whd.conf"
#
# W1 = WiFi-only scan. BT-over-WHD (the cybt transport re-arbitrated onto the
# WHD bus) is W3, at which point CONFIG_BT is re-enabled here.

# Select the WHD transport backend. This module then contributes no WiFi/BT
# net device (CMake-gated in drivers/wifi/zephyr_cyw43/CMakeLists.txt); the
# board overlay keeps the stock infineon,airoc-wifi node.
CONFIG_CYW43_TRANSPORT_WHD=y

# Upstream AIROC/WHD WiFi driver for the CYW43439 (Pico 2 W = Murata 1YN
# module). WIFI_AIROC is default-y on the DT node but app/prj.conf forces it
# off for the georgerobotics default, so re-enable it explicitly here.
CONFIG_WIFI_AIROC=y
CONFIG_CYW43439=y
CONFIG_CYW43439_MURATA_1YN=y

# W3+: BT-over-WHD enabled. cybt_shared_bus is retained and driven over the WHD
# bus by drivers/wifi/zephyr_cyw43/src/whd/whd_bt_glue.c. Requires whd.overlay to
# also restore a bt_hci node + zephyr,bt_hci chosen.
CONFIG_BT=y
