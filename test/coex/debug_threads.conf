# Thread-instrumentation overlay for the item-4 bus-arbitration audit.
# Lets `kernel threads` / `kernel stacks` report every thread's priority, state
# and stack high-water mark over the console, and enables the thread analyzer.
# Used only for diagnosis (not the shipped config):
#   west build -b rpi_pico2/rp2350a/m33/w -d build_dbg app \
#       -- -DEXTRA_CONF_FILE="<abs>/app/local.conf;<abs>/test/coex/debug_threads.conf"
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_INIT_STACKS=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_THREAD_ANALYZER_AUTO=n
CONFIG_KERNEL_SHELL=y
