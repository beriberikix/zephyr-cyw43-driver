# Soak build config (WiFi+BLE coexistence gate).
# Merge on top of app/prj.conf + local.conf:
#   west build -p always -b rpi_pico2/rp2350a/m33/w -d build_soak app \
#     -- -DEXTRA_CONF_FILE="<abs>/app/local.conf;<abs>/test/coex/soak.conf"
#
# - Self-start the BLE notify peripheral (no manual shell needed for the soak).
# - Drop the BT shell: the soak app drives BT itself, and running the BT shell
#   alongside a self-starting peripheral adds a second set of conn callbacks /
#   GATT state. The kernel + net shells stay for console monitoring.
# - Give the system workqueue more stack (the BLE-connection fault was on
#   sys_work_q_stack, which the thread audit showed at ~86% before any BLE conn).
CONFIG_APP_BLE_PERIPHERAL=y
CONFIG_BT_SHELL=n
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
