# Soak build config (WiFi+BLE coexistence gate).
# Merge on top of app/prj.conf + local.conf:
#   west build -p always -b rpi_pico2/rp2350a/m33/w -d build_soak app \
#     -- -DEXTRA_CONF_FILE="<abs>/app/local.conf;<abs>/test/coex/soak.conf"
#
# - Self-start the BLE notify peripheral (no manual shell needed for the soak).
# - Drop the BT shell: the soak app drives BT itself, and running the BT shell
#   alongside a self-starting peripheral adds a second set of conn callbacks /
#   GATT state. The kernel + net shells stay for console monitoring.
# - Give the system workqueue more stack (the BLE-connection fault was on
#   sys_work_q_stack, which the thread audit showed at ~86% before any BLE conn).
CONFIG_APP_BLE_PERIPHERAL=y
CONFIG_BT_SHELL=n
# 4096 (was 2048): on the WHD backend the BLE GATT/service-discovery work runs on
# the system workqueue, and 2048 (already ~86% before any BLE conn) overflowed
# during service discovery -> the central dropped the link. soak.conf layers
# AFTER whd.conf, so its 4096 must be set here too or it would be overridden.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# NOTE: bumping BT host RX/TX buffers (EVT_RX 32, CONN_TX 8, ...) was tried and
# did NOT reduce the residual cybt-ring-overflow fault rate, so the bottleneck is
# not host buffer exhaustion -- it is cooperative-thread starvation (the BT RX
# workqueue at coop -8 monopolises the CPU while the poll at -2 can't drain the
# controller's bt2host ring). See PROGRESS "residual cybt overflow".

# --- Relax the BLE link so it survives WiFi+BT coex contention (W4/W6) ---
# Under concurrent WiFi traffic the WHD WLAN path holds the shared gSPI bus and
# the in-chip coex arbiter yields the radio to WiFi in bursts. If a burst
# silences the BT link longer than the connection's supervision timeout, the
# central drops the link (HCI reason 0x08) even though the Pico is fault-free
# (soak: "notif=1 ... end=ALIVE disc=1"). The default peripheral preferred
# supervision timeout is 42 = 420 ms -- far too tight for these gaps. Raise it to
# 400 = 4 s so the link rides out coex bursts. Fire the L2CAP param-update
# request early (400 ms instead of the 5 s default) so the relaxed timeout
# applies near the start of the connection, not after service discovery.
# (georgerobotics already passed the bounded soak; a longer timeout cannot
# regress it -- it only widens the tolerance window.)
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_CONN_PARAM_UPDATE_TIMEOUT=400
