# Extra config to smoke-test the BLE ISO path (backlog item 2).
# Enables ISO unicast (peripheral + central), which selects BT_ISO + BT_ISO_TX
# + BT_ISO_RX, so the ISO RX branch in cyw43_bluetooth_hci_process() is compiled
# and exercised, and the `bt iso` shell commands are available. The lean
# reference app (app/prj.conf) intentionally leaves ISO off; this fragment is
# only merged for the smoke build:
#   west build -b rpi_pico2/rp2350a/m33/w -d build_iso app \
#       -- -DEXTRA_CONF_FILE="test/coex/iso_smoke.conf"
# ISO UNICAST only (CIS over a connection). Broadcaster/sync (BIS) is
# intentionally NOT enabled: it pulls in LE Extended/Periodic Advertising, and
# the CYW43 (CYW4343A2) controller does not support LE Extended Advertising
# (HCI opcodes 0x2036/0x203a return status 0x01 "Unknown HCI Command"), which
# would break even legacy `bt advertise on`. Unicast exercises the same ISO
# RX/TX buffer paths (BT_ISO_TX/RX) without requiring extended advertising.
CONFIG_BT_ISO_PERIPHERAL=y
CONFIG_BT_ISO_CENTRAL=y
